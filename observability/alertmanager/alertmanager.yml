global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Configure SMTP, Slack, or PagerDuty through environment-specific secrets.
    # An empty receiver keeps local development quiet.
