groups:
  - name: hostelghar-recording
    interval: 30s
    rules:
      - record: hostelghar:http_request_rate_5m
        expr: sum by (service) (rate(http_requests_total[5m]))
      - record: hostelghar:http_error_rate_5m
        expr: sum by (service) (rate(http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1)
      - record: hostelghar:http_latency_p95_5m
        expr: histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))
