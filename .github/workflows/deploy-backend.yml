name: Deploy Hostel Ghar Backend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip lint & tests for emergency deployment'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-cpanel-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run type checking
        if: ${{ !inputs.skip_tests }}
        run: npm run typecheck

      - name: Run code linter
        if: ${{ !inputs.skip_tests }}
        run: npm run lint

      - name: Run unit tests (hermetic)
        if: ${{ !inputs.skip_tests }}
        env:
          NODE_ENV: test
          ACCESS_TOKEN_SECRET: ci-test-access-secret-not-for-production
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-not-for-production
        run: npm test

      - name: Build backend application
        run: npm run build

      - name: Validate build output
        run: |
          echo "Verifying backend build artifacts..."
          test -f "dist/index.js" || { echo "::error::dist/index.js was not generated."; exit 1; }
          test -f "package.json" || { echo "::error::package.json missing."; exit 1; }
          test -f "package-lock.json" || { echo "::error::package-lock.json missing."; exit 1; }
          echo "Build artifacts verified successfully."

      - name: Assemble production distribution bundle
        run: |
          echo "Assembling production bundle for deployment..."
          rm -rf deploy-staging
          mkdir -p deploy-staging
          cp -r dist deploy-staging/
          cp package.json deploy-staging/
          cp package-lock.json deploy-staging/
          if [ -f "app.js" ]; then
            cp app.js deploy-staging/
          fi

          cd deploy-staging
          tar -czf ../deploy-bundle.tar.gz .
          cd ..
          echo "Created deploy-bundle.tar.gz ($(du -h deploy-bundle.tar.gz | cut -f1))"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to cPanel Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy-bundle

      - name: Configure SSH key and agent
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY || secrets.HOSTELGHAR_API || secrets.HOSTELGHAR_BACKEND || secrets.HOSTELGHAR_FRONTEND || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.DEPLOY_KEY || secrets.PRIVATE_KEY || secrets.CPANEL_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE || secrets.SSH_PASSPHRASE || '' }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || vars.CPANEL_HOST || 'server2.bisuphost.com' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER || vars.CPANEL_USER || 'hostelgh' }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || vars.CPANEL_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          KEY_FILE="$HOME/.ssh/cpanel_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Start ssh-agent
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # Non-interactive ssh-add using secure askpass helper
          ASKPASS_HELPER="$RUNNER_TEMP/askpass.sh"
          cat << 'EOF' > "$ASKPASS_HELPER"
          #!/bin/sh
          echo "$SSH_PASSPHRASE"
          EOF
          chmod 700 "$ASKPASS_HELPER"

          DISPLAY=dummy SSH_ASKPASS="$ASKPASS_HELPER" SSH_ASKPASS_REQUIRE=force ssh-add "$KEY_FILE"
          rm -f "$ASKPASS_HELPER"

          # Unlock the local key file on the runner so -i also works directly
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f "$KEY_FILE" >/dev/null 2>&1 || true
          fi

          echo "Loaded identities in ssh-agent:"
          ssh-add -l -E sha256

          # Register host keys in known_hosts
          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 644 "$HOME/.ssh/known_hosts"

          {
            echo "SSH_KEY_PATH=$KEY_FILE"
            echo "CPANEL_HOST=$CPANEL_HOST"
            echo "CPANEL_USER=$CPANEL_USER"
            echo "CPANEL_PORT=$CPANEL_PORT"
          } >> "$GITHUB_ENV"

          echo "✅ SSH Agent initialized and key loaded."

      - name: Pre-deployment remote connectivity check
        shell: bash
        env:
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -T
            -p "$CPANEL_PORT"
            -i "$SSH_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o TCPKeepAlive=yes
            -o StrictHostKeyChecking=accept-new
          )

          echo "Testing remote command execution on $CPANEL_HOST..."
          ssh "${SSH_OPTS[@]}" "$CPANEL_USER@$CPANEL_HOST" 'echo "SSH_CONNECTION_SUCCESSFUL"; whoami; pwd'

      - name: Upload bundle and deploy backend on cPanel
        shell: bash
        env:
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -T
            -p "$CPANEL_PORT"
            -i "$SSH_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o TCPKeepAlive=yes
            -o StrictHostKeyChecking=accept-new
          )

          SCP_OPTS=(
            -P "$CPANEL_PORT"
            -i "$SSH_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o TCPKeepAlive=yes
            -o StrictHostKeyChecking=accept-new
          )

          APP_DIR="/home/hostelgh/hostelghar_api"
          BACKUP_DIR="/home/hostelgh/hostelghar_api_backups"
          TMP_DIR="/home/hostelgh/tmp_api_deploy"

          echo "1. Creating remote directories if missing..."
          ssh "${SSH_OPTS[@]}" "$CPANEL_USER@$CPANEL_HOST" "mkdir -p '$TMP_DIR' '$BACKUP_DIR' '$APP_DIR'"

          echo "2. Uploading deployment bundle..."
          scp "${SCP_OPTS[@]}" deploy-bundle.tar.gz "$CPANEL_USER@$CPANEL_HOST:$TMP_DIR/deploy-bundle.tar.gz"

          echo "3. Uploading remote deployment script..."
          scp "${SCP_OPTS[@]}" scripts/remote-deploy.sh "$CPANEL_USER@$CPANEL_HOST:$TMP_DIR/remote-deploy.sh"

          echo "4. Executing remote deployment script..."
          ssh "${SSH_OPTS[@]}" "$CPANEL_USER@$CPANEL_HOST" "bash '$TMP_DIR/remote-deploy.sh'"

          echo "✅ Remote deployment completed."

      - name: Verify production deployment (Health Check)
        shell: bash
        run: |
          HEALTH_URL="https://api.hostelghar.com/health"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          SUCCESS=0

          echo "Starting health check against $HEALTH_URL..."
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" -L "$HEALTH_URL" || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP status $STATUS"

            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Health check passed! API is live and responding (HTTP $STATUS)."
              SUCCESS=1
              break
            fi
            sleep $SLEEP_SECONDS
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Health check failed after $MAX_ATTEMPTS attempts."
            echo "Initiating automated rollback to previous release..."

            SSH_OPTS=(
              -T
              -p "$CPANEL_PORT"
              -i "$SSH_KEY_PATH"
              -o BatchMode=yes
              -o ConnectTimeout=20
              -o StrictHostKeyChecking=accept-new
            )
            ssh "${SSH_OPTS[@]}" "$CPANEL_USER@$CPANEL_HOST" "bash -s" < scripts/remote-rollback.sh
            exit 1
          fi

      - name: Cleanup SSH credentials
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k || true
          fi
          if [ -n "${SSH_KEY_PATH:-}" ] && [ -f "$SSH_KEY_PATH" ]; then
            shred -u "$SSH_KEY_PATH" 2>/dev/null || rm -f "$SSH_KEY_PATH"
          fi
