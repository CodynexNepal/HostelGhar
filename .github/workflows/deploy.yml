# ──────────────────────────────────────────────────────────────────────────────
# Hostel Ghar — Production Deployment
#
# Manually triggered workflow that deploys a specific Docker image to
# production. Uses GitHub Environment protection rules for approval gates.
#
# The workflow:
#   1. Validates the image exists in GHCR
#   2. Deploys the exact immutable image (by commit SHA)
#   3. Runs health checks and smoke tests
#   4. Rolls back automatically if verification fails
#
# IMPORTANT: This workflow requires environment secrets to be configured.
# See docs/CICD.md for the full list.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag (commit SHA). Leave empty to use the latest main commit.'
        required: false
        type: string

# Prevent simultaneous deployments to the same environment
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Validate ─────────────────────────────────────────────────────────────
  validate:
    name: Validate Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      image-tag: ${{ steps.resolve.outputs.tag }}
      full-image: ${{ steps.resolve.outputs.full-image }}

    steps:
      - name: Resolve image tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "full-image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists in registry
        run: |
          docker manifest inspect ${{ steps.resolve.outputs.full-image }} > /dev/null 2>&1 || {
            echo "::error::Image ${{ steps.resolve.outputs.full-image }} not found in registry"
            echo "Build the image first by pushing to main and waiting for the Docker workflow."
            exit 1
          }
          echo "Image verified: ${{ steps.resolve.outputs.full-image }}"

  # ── Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: [validate]

    # GitHub Environment protection rules — production requires manual approval
    environment:
      name: ${{ github.event.inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout (for deployment scripts)
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────────
      # TODO: Replace this step with your actual deployment method.
      #
      # Option A — VPS with SSH:
      #   - name: Deploy via SSH
      #     uses: appleboy/ssh-action@v1
      #     with:
      #       host: ${{ secrets.DEPLOY_HOST }}
      #       username: ${{ secrets.DEPLOY_USER }}
      #       key: ${{ secrets.DEPLOY_SSH_KEY }}
      #       script: |
      #         cd /opt/hostelghar
      #         export IMAGE_TAG=${{ needs.validate.outputs.image-tag }}
      #         docker compose -f docker-compose.production.yml pull
      #         docker compose -f docker-compose.production.yml up -d
      #
      # Option B — Railway:
      #   - name: Deploy to Railway
      #     run: railway up --service hostelghar
      #
      # Option C — AWS ECS:
      #   - name: Deploy to ECS
      #     uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      # ────────────────────────────────────────────────────────────────────

      - name: Deploy
        id: deploy
        run: |
          IMAGE="${{ needs.validate.outputs.full-image }}"
          ENV="${{ github.event.inputs.environment }}"

          echo "Deploying $IMAGE to $ENV"
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | $ENV |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY

          # TODO: Set this to your actual deployment URL
          echo "url=https://$ENV.hostelghar.example.com" >> "$GITHUB_OUTPUT"

          echo "::warning::Deployment step is a placeholder. Configure your deployment target in this workflow."

  # ── Verify ───────────────────────────────────────────────────────────────
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [validate, deploy]

    steps:
      # TODO: Replace with your actual health check URL
      - name: Wait for container startup
        run: sleep 15

      - name: Health check
        id: healthcheck
        continue-on-error: true
        run: |
          # TODO: Replace with your actual deployment URL
          HEALTH_URL="https://${{ github.event.inputs.environment }}.hostelghar.example.com/health"
          echo "Checking health at: $HEALTH_URL"

          MAX_RETRIES=5
          RETRY_DELAY=10

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_STATUS)"
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Health check returned HTTP $HTTP_STATUS, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "::error::Health check failed after $MAX_RETRIES attempts"
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Smoke test
        if: steps.healthcheck.outcome == 'success'
        run: |
          # TODO: Replace with your actual deployment URL
          BASE_URL="https://${{ github.event.inputs.environment }}.hostelghar.example.com"

          echo "Running smoke tests against $BASE_URL"

          # Verify health endpoint returns valid JSON
          RESPONSE=$(curl -s "$BASE_URL/health")
          echo "Health response: $RESPONSE"

          STATUS=$(echo "$RESPONSE" | jq -r '.status' 2>/dev/null || echo "unknown")
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Smoke test failed — health status is '$STATUS', expected 'ok'"
            exit 1
          fi

          echo "Smoke tests passed"

  # ── Rollback ─────────────────────────────────────────────────────────────
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [validate, deploy, verify]
    if: failure() && needs.deploy.result == 'success'

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: Implement actual rollback logic using the previous image
      - name: Rollback deployment
        run: |
          echo "::error::Deployment verification failed — initiating rollback"
          echo "## Rollback Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed Image** | \`${{ needs.validate.outputs.full-image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Automatic rollback is a placeholder. See docs/CICD.md for manual rollback steps." >> $GITHUB_STEP_SUMMARY

          echo "::warning::Rollback step is a placeholder. Configure rollback logic when deployment target is set."
