name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip lint & tests for emergency deployment'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-cpanel-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run type checking
        if: ${{ !inputs.skip_tests }}
        run: npm run typecheck

      - name: Run code linter
        if: ${{ !inputs.skip_tests }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !inputs.skip_tests }}
        env:
          NODE_ENV: test
          ACCESS_TOKEN_SECRET: ci-test-access-secret-not-for-production
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-not-for-production
        run: npm test

      - name: Build backend application
        run: npm run build

      - name: Validate build output
        run: |
          echo "Verifying backend build artifacts..."
          if [ ! -f "dist/index.js" ]; then
            echo "::error::Build verification failed: dist/index.js was not generated."
            exit 1
          fi
          if [ ! -f "package.json" ] || [ ! -f "package-lock.json" ]; then
            echo "::error::Build verification failed: package manifests are missing."
            exit 1
          fi
          echo "dist/index.js and package manifests verified successfully."

      - name: Assemble backend distribution bundle
        run: |
          echo "Assembling production bundle for deployment..."
          rm -rf deploy-staging
          mkdir -p deploy-staging
          cp -r dist deploy-staging/
          cp package.json deploy-staging/
          cp package-lock.json deploy-staging/

          cd deploy-staging
          tar -czf ../deploy-bundle.tar.gz .
          cd ..
          echo "Created deploy-bundle.tar.gz ($(du -h deploy-bundle.tar.gz | cut -f1))"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to cPanel Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy-bundle

      - name: Configure SSH key
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || vars.CPANEL_HOST || 'server2.bisuphost.com' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER || vars.CPANEL_USER || 'hostelgh' }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || vars.CPANEL_PORT || '22' }}
          SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY || secrets.HOSTELGHAR_API || secrets.HOSTELGHAR_BACKEND || secrets.HOSTELGHAR_FRONTEND || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.DEPLOY_KEY || secrets.PRIVATE_KEY || secrets.CPANEL_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY_B64" ]; then
            echo "::error::No SSH key found in secrets (checked CPANEL_SSH_KEY, HOSTELGHAR_API, HOSTELGHAR_BACKEND, HOSTELGHAR_FRONTEND, SSH_PRIVATE_KEY)."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode base64 if encoded, or write raw key
          if printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/cpanel_deploy_key 2>/dev/null && ssh-keygen -y -f ~/.ssh/cpanel_deploy_key > /dev/null 2>&1; then
            echo "SSH key decoded from base64 successfully."
          else
            printf '%s\n' "$SSH_KEY_B64" | tr -d '\r' > ~/.ssh/cpanel_deploy_key
          fi

          chmod 600 ~/.ssh/cpanel_deploy_key
          ssh-keygen -y -f ~/.ssh/cpanel_deploy_key > /dev/null

          echo "Scanning SSH host keys for $CPANEL_HOST on port $CPANEL_PORT..."
          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Export key path and connection variables for subsequent steps
          echo "SSH_KEY_PATH=$HOME/.ssh/cpanel_deploy_key" >> $GITHUB_ENV
          echo "CPANEL_PORT=$CPANEL_PORT" >> $GITHUB_ENV
          echo "CPANEL_HOST=$CPANEL_HOST" >> $GITHUB_ENV
          echo "CPANEL_USER=$CPANEL_USER" >> $GITHUB_ENV

      - name: Transfer bundle and deploy on cPanel
        run: |
          APP_DIR="/home/hostelgh/hostelghar_api"
          BACKUP_DIR="/home/hostelgh/hostelghar_api_backups"
          TMP_DIR="/home/hostelgh/tmp_api_deploy"

          echo "1. Uploading deployment bundle and scripts to cPanel..."
          ssh -p "$CPANEL_PORT" -i "$SSH_KEY_PATH" "$CPANEL_USER@$CPANEL_HOST" "mkdir -p $TMP_DIR $BACKUP_DIR $APP_DIR"
          scp -P "$CPANEL_PORT" -i "$SSH_KEY_PATH" deploy-bundle.tar.gz "$CPANEL_USER@$CPANEL_HOST:$TMP_DIR/deploy-bundle.tar.gz"
          scp -P "$CPANEL_PORT" -i "$SSH_KEY_PATH" scripts/remote-deploy.sh "$CPANEL_USER@$CPANEL_HOST:$TMP_DIR/remote-deploy.sh"

          echo "2. Executing safe atomic deployment on cPanel..."
          ssh -p "$CPANEL_PORT" -i "$SSH_KEY_PATH" "$CPANEL_USER@$CPANEL_HOST" "bash $TMP_DIR/remote-deploy.sh"

      - name: Verify production deployment (Health Check)
        run: |
          HEALTH_URL="https://api.hostelghar.com/health"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          SUCCESS=0

          echo "Starting health check on $HEALTH_URL (max attempts: $MAX_ATTEMPTS)..."
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" -L "$HEALTH_URL" || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP response code $STATUS"

            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Health check passed! API is active (HTTP $STATUS)."
              SUCCESS=1
              break
            fi
            sleep $SLEEP_SECONDS
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Production health check failed after $MAX_ATTEMPTS attempts."
            echo "Triggering automated rollback to previous working release..."

            ssh -p "$CPANEL_PORT" -i "$SSH_KEY_PATH" "$CPANEL_USER@$CPANEL_HOST" "bash -s" < scripts/remote-rollback.sh
            exit 1
          fi

      - name: Cleanup SSH credentials
        if: always()
        run: |
          if [ -n "${SSH_KEY_PATH:-}" ] && [ -f "$SSH_KEY_PATH" ]; then
            shred -u "$SSH_KEY_PATH" 2>/dev/null || rm -f "$SSH_KEY_PATH"
            echo "Deployment SSH key securely removed."
          fi
