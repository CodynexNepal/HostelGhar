name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostelghar-cpanel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /home/hostelgh/hostelghar_api
  NODE_VERSION: '20'
  HEALTH_URL: https://api.hostelghar.com/health

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck --if-present

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build backend
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.js || {
            echo "::error::dist/index.js was not generated"
            exit 1
          }

          test -f package.json
          test -f package-lock.json

      - name: Package application
        run: |
          set -eu

          # Package the repository but exclude secrets, dependencies,
          # Git history, logs, caches, and generated archives.
          tar -czf "$RUNNER_TEMP/hostelghar-deploy.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./coverage' \
            --exclude='./*.log' \
            --exclude='./node_modules_backup' \
            --exclude='./.next' \
            --exclude='./.turbo' \
            .

          test -s "$RUNNER_TEMP/hostelghar-deploy.tar.gz"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::Missing CPANEL_SSH_KEY secret"
            exit 1
          }

          test -n "$SSH_HOST" || {
            echo "::error::Missing CPANEL_HOST secret"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cpanel_key"
          chmod 600 "$HOME/.ssh/cpanel_key"

          # For stronger host verification, pin a verified host key
          # in a CPANEL_KNOWN_HOSTS secret instead of trusting a scan.
          if [ -n "${{ secrets.CPANEL_KNOWN_HOSTS }}" ]; then
            printf '%s\n' '${{ secrets.CPANEL_KNOWN_HOSTS }}' \
              > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" \
              > "$HOME/.ssh/known_hosts"
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

          {
            echo "CPANEL_HOST=$SSH_HOST"
            echo "CPANEL_PORT=$SSH_PORT"
          } >> "$GITHUB_ENV"

      - name: Test SSH connection
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -euo pipefail

          test -n "$CPANEL_USER" || {
            echo "::error::Missing CPANEL_USER secret"
            exit 1
          }

          ssh -T \
            -i "$HOME/.ssh/cpanel_key" \
            -p "$CPANEL_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$CPANEL_USER@$CPANEL_HOST" \
            'printf "SSH_OK\n"'

      - name: Upload deployment bundle
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -euo pipefail

          scp -i "$HOME/.ssh/cpanel_key" \
            -P "$CPANEL_PORT" \
            -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/hostelghar-deploy.tar.gz" \
            "$CPANEL_USER@$CPANEL_HOST:hostelghar-deploy-${GITHUB_SHA}.tar.gz"

      - name: Deploy application
        id: deploy
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -euo pipefail

          ssh -T \
            -i "$HOME/.ssh/cpanel_key" \
            -p "$CPANEL_PORT" \
            -o IdentitiesOnly=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -eu

          ARCHIVE="$HOME/hostelghar-deploy-${DEPLOY_SHA}.tar.gz"
          BACKUP="$HOME/hostelghar-backup-${DEPLOY_SHA}.tar.gz"
          STAGING="$HOME/hostelghar-staging-${DEPLOY_SHA}"

          test -s "$ARCHIVE"
          test -d "$APP_DIR"
          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/package-lock.json"

          # Use the cPanel-provided Node environment.
          source "$HOME/nodevenv/hostelghar_api/20/bin/activate"

          node --version
          npm --version

          # Preserve the previous production build and manifests.
          tar -czf "$BACKUP" \
            -C "$APP_DIR" \
            dist package.json package-lock.json

          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          tar -xzf "$ARCHIVE" -C "$STAGING"

          test -f "$STAGING/dist/index.js"
          test -f "$STAGING/package.json"
          test -f "$STAGING/package-lock.json"

          # Do not replace the production .env file.
          # Keep the existing cPanel app root and startup configuration.
          cp -a "$STAGING/dist" "$APP_DIR/dist.new"
          mv "$APP_DIR/dist" "$APP_DIR/dist.previous"
          mv "$APP_DIR/dist.new" "$APP_DIR/dist"

          cp "$STAGING/package.json" "$APP_DIR/package.json.new"
          cp "$STAGING/package-lock.json" "$APP_DIR/package-lock.json.new"
          mv "$APP_DIR/package.json.new" "$APP_DIR/package.json"
          mv "$APP_DIR/package-lock.json.new" "$APP_DIR/package-lock.json"

          if ! (
            cd "$APP_DIR"
            npm ci --omit=dev
          ); then
            echo "Production dependency installation failed."
            mv "$APP_DIR/dist.previous" "$APP_DIR/dist"
            tar -xzf "$BACKUP" -C "$APP_DIR"
            exit 1
          fi

          # Passenger/cPanel commonly monitors this restart marker.
          # Confirm this matches the configured application type.
          mkdir -p "$APP_DIR/tmp"
          touch "$APP_DIR/tmp/restart.txt"

          echo "Deployment files installed for $DEPLOY_SHA"

          rm -rf "$STAGING"
          rm -f "$ARCHIVE"
          REMOTE

      - name: Verify production API
        id: healthcheck
        env:
          HEALTH_URL: ${{ env.HEALTH_URL }}
        run: |
          set -u

          for attempt in $(seq 1 12); do
            status="$(curl -sS -L \
              --connect-timeout 10 \
              --max-time 20 \
              -o /tmp/hostelghar-health.json \
              -w '%{http_code}' \
              "$HEALTH_URL" || true)"

            if [ "$status" = "200" ]; then
              echo "Production health endpoint returned HTTP 200."
              cat /tmp/hostelghar-health.json
              exit 0
            fi

            echo "Health check $attempt/12 returned HTTP ${status:-unknown}."
            sleep 10
          done

          echo "::error::Production health check failed."
          exit 1

      - name: Roll back failed deployment
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -euo pipefail

          ssh -T \
            -i "$HOME/.ssh/cpanel_key" \
            -p "$CPANEL_PORT" \
            -o IdentitiesOnly=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -eu

          BACKUP="$HOME/hostelghar-backup-${DEPLOY_SHA}.tar.gz"

          if [ ! -s "$BACKUP" ]; then
            echo "No backup found; automatic rollback is unavailable."
            exit 1
          fi

          source "$HOME/nodevenv/hostelghar_api/20/bin/activate"

          tar -xzf "$BACKUP" -C "$APP_DIR"

          if ! (cd "$APP_DIR" && npm ci --omit=dev); then
            echo "Rollback restored files, but dependency installation failed."
            exit 1
          fi

          mkdir -p "$APP_DIR/tmp"
          touch "$APP_DIR/tmp/restart.txt"

          echo "Previous application files restored."
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f "$HOME/.ssh/cpanel_key",
