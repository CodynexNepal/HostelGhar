name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip lint & tests for emergency deployment'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-cpanel-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run type checking
        if: ${{ !inputs.skip_tests }}
        run: npm run typecheck

      - name: Run code linter
        if: ${{ !inputs.skip_tests }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !inputs.skip_tests }}
        env:
          NODE_ENV: test
          ACCESS_TOKEN_SECRET: ci-test-access-secret-not-for-production
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-not-for-production
        run: npm test

      - name: Build backend application
        run: npm run build

      - name: Validate build output
        run: |
          echo "Verifying backend build artifacts..."
          if [ ! -f "dist/index.js" ]; then
            echo "::error::Build verification failed: dist/index.js was not generated."
            exit 1
          fi
          if [ ! -f "package.json" ] || [ ! -f "package-lock.json" ]; then
            echo "::error::Build verification failed: package manifests are missing."
            exit 1
          fi
          echo "dist/index.js and package manifests verified successfully."

      - name: Assemble backend distribution bundle
        run: |
          echo "Assembling production bundle for deployment..."
          rm -rf deploy-staging
          mkdir -p deploy-staging
          cp -r dist deploy-staging/
          cp package.json deploy-staging/
          cp package-lock.json deploy-staging/

          cd deploy-staging
          tar -czf ../deploy-bundle.tar.gz .
          cd ..
          echo "Created deploy-bundle.tar.gz ($(du -h deploy-bundle.tar.gz | cut -f1))"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to cPanel Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy-bundle

      - name: Configure SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY || secrets.HOSTELGHAR_API || secrets.HOSTELGHAR_BACKEND || secrets.HOSTELGHAR_FRONTEND || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.DEPLOY_KEY || secrets.PRIVATE_KEY || secrets.CPANEL_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE || secrets.SSH_PASSPHRASE || '' }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || vars.CPANEL_HOST || 'server2.bisuphost.com' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER || vars.CPANEL_USER || 'hostelgh' }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || vars.CPANEL_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          KEY_FILE="$HOME/.ssh/cpanel_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -P "$SSH_PASSPHRASE" -f "$KEY_FILE" >/dev/null; then
            echo "::error::Private key or passphrase is incorrect."
            exit 1
          fi

          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f "$KEY_FILE" >/dev/null 2>&1 || true
          fi

          # Start SSH agent and load the key
          eval "$(ssh-agent -s)"
          ssh-add "$KEY_FILE"

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          {
            echo "SSH_KEY_PATH=$KEY_FILE"
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "CPANEL_HOST=$CPANEL_HOST"
            echo "CPANEL_USER=$CPANEL_USER"
            echo "CPANEL_PORT=$CPANEL_PORT"
          } >> "$GITHUB_ENV"

          echo "SSH private key validated and loaded successfully."

      - name: Upload and deploy backend
        shell: bash
        env:
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -p "$CPANEL_PORT"
            -i "$SSH_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o TCPKeepAlive=yes
            -o StrictHostKeyChecking=accept-new
          )

          APP_DIR="/home/hostelgh/hostelghar_api"
          BACKUP_DIR="/home/hostelgh/hostelghar_api_backups"
          TMP_DIR="/home/hostelgh/tmp_api_deploy"

          echo "1. Testing SSH connection..."
          ssh "${SSH_OPTS[@]}" \
            "$CPANEL_USER@$CPANEL_HOST" \
            'echo "SSH connection successful"; whoami'

          echo "2. Creating deployment directories..."
          ssh "${SSH_OPTS[@]}" "$CPANEL_USER@$CPANEL_HOST" \
            "mkdir -p '$TMP_DIR' '$BACKUP_DIR' '$APP_DIR'"

          echo "3. Uploading deployment bundle..."
          scp -P "$CPANEL_PORT" \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new \
            deploy-bundle.tar.gz \
            "$CPANEL_USER@$CPANEL_HOST:$TMP_DIR/deploy-bundle.tar.gz"

          echo "4. Uploading deployment script..."
          scp -P "$CPANEL_PORT" \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new \
            scripts/remote-deploy.sh \
            "$CPANEL_USER@$CPANEL_HOST:$TMP_DIR/remote-deploy.sh"

          echo "5. Executing deployment..."
          ssh "${SSH_OPTS[@]}" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "bash '$TMP_DIR/remote-deploy.sh'"

          echo "Deployment command completed."

      - name: Verify production deployment (Health Check)
        run: |
          HEALTH_URL="https://api.hostelghar.com/health"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          SUCCESS=0

          echo "Starting health check on $HEALTH_URL (max attempts: $MAX_ATTEMPTS)..."
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" -L "$HEALTH_URL" || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP response code $STATUS"

            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Health check passed! API is active (HTTP $STATUS)."
              SUCCESS=1
              break
            fi
            sleep $SLEEP_SECONDS
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Production health check failed after $MAX_ATTEMPTS attempts."
            echo "Triggering automated rollback to previous working release..."

            ssh -p "$CPANEL_PORT" -i "$SSH_KEY_PATH" "$CPANEL_USER@$CPANEL_HOST" "bash -s" < scripts/remote-rollback.sh
            exit 1
          fi

      - name: Cleanup SSH credentials
        if: always()
        run: |
          if [ -n "${SSH_KEY_PATH:-}" ] && [ -f "$SSH_KEY_PATH" ]; then
            shred -u "$SSH_KEY_PATH" 2>/dev/null || rm -f "$SSH_KEY_PATH"
            echo "Deployment SSH key securely removed."
          fi
