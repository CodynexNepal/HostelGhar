# ──────────────────────────────────────────────────────────────────────────────
# Hostel Ghar — Continuous Integration
#
# Runs on every PR and push to main. Validates code quality, type safety,
# tests, and build integrity before any merge is allowed.
#
# This workflow uses least-privilege permissions and cancels redundant runs
# for the same PR to save CI minutes.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress CI runs for the same branch/PR — no point validating
# an outdated commit when a newer one has been pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Validate: lint, format, typecheck in parallel ────────────────────────
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format-check, typecheck]
        include:
          - check: lint
            command: npm run lint
          - check: format-check
            command: npm run format:check
          - check: typecheck
            command: npm run typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  # ── Test ─────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [validate]

    # PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hostelghar_test
          POSTGRES_USER: hostelghar
          POSTGRES_PASSWORD: hostelghar_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hostelghar -d hostelghar_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://hostelghar:hostelghar_test_pass@localhost:5432/hostelghar_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      ACCESS_TOKEN_SECRET: ci-test-access-secret-not-for-production
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-not-for-production
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      SALT_ROUND: 4
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Build ────────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -f dist/index.js ]; then
            echo "::error::Build output dist/index.js not found"
            exit 1
          fi
          echo "Build output verified: $(wc -l < dist/index.js) lines"
